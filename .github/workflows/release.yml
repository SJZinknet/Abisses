name: Construire et publier Abisses

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Installateur Windows
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Vérifier la version du tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($version -ne $tagVersion) {
            throw "VERSION ($version) ne correspond pas au tag ($tagVersion)."
          }

      - name: Installer les dépendances de construction
        run: python -m pip install -r requirements-build-lock.txt

      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Construire l'installateur
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Tester l'installation Windows complète
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "release\*.exe" | Select-Object -First 1).FullName
          if (-not $installer) {
            throw "Installateur Windows introuvable."
          }

          $installation = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            throw "L'installation silencieuse a échoué avec le code $($installation.ExitCode)."
          }

          $application = Join-Path $env:LOCALAPPDATA "Programs\Abisses\Abisses.exe"
          if (-not (Test-Path $application)) {
            throw "Abisses.exe est absent après l'installation."
          }

          $selfTest = Start-Process -FilePath $application -ArgumentList "--self-test" -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) {
            throw "L'auto-test de l'application installée a échoué avec le code $($selfTest.ExitCode)."
          }

      - name: Conserver l'installateur Windows
        uses: actions/upload-artifact@v7
        with:
          name: abisses-windows
          path: release/*.exe
          if-no-files-found: error

  ubuntu:
    name: Paquet Ubuntu
    # Construire sur 22.04 vise Ubuntu 22.04 et les versions plus récentes.
    runs-on: ubuntu-22.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Vérifier la version du tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag_version" ]]; then
            echo "VERSION ($version) ne correspond pas au tag ($tag_version)." >&2
            exit 1
          fi

      - name: Installer les bibliothèques système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv python3-pip python3-tk dpkg-dev file \
            libtcl8.6 libtk8.6 libgl1 libglib2.0-0

      - name: Installer les dépendances de construction
        shell: bash
        run: |
          # Ubuntu 22.04 fournit Python 3.10 et Tk 8.6 issus des mêmes paquets
          # système. Ce couple évite de fabriquer un bundle lié à une autre
          # version privée de Tcl/Tk et reste compatible avec Ubuntu 22.04+.
          python3 -m venv .build-venv
          .build-venv/bin/python -m pip install --upgrade pip
          .build-venv/bin/python -m pip install -r requirements-build-lock.txt

      - name: Construire l'application et le paquet
        shell: bash
        run: |
          .build-venv/bin/python packaging/build_icons.py
          .build-venv/bin/python -m PyInstaller --noconfirm --clean packaging/abisses.spec
          bash packaging/linux/build_deb.sh

      - name: Vérifier le paquet
        shell: bash
        run: |
          bash packaging/linux/check_bundle.sh dist/Abisses
          dist/Abisses/Abisses --self-test
          dpkg-deb --info release/*.deb
          dpkg-deb --contents release/*.deb | sed -n '1,80p'

      - name: Tester l'installation Ubuntu complète
        shell: bash
        run: |
          sudo apt-get install -y ./release/*.deb
          /usr/bin/abisses --self-test
          test -f /usr/share/applications/abisses.desktop
          test -f /usr/share/icons/hicolor/512x512/apps/abisses.png

      - name: Conserver le paquet Ubuntu
        uses: actions/upload-artifact@v7
        with:
          name: abisses-ubuntu
          path: release/*.deb
          if-no-files-found: error

  release:
    name: Release GitHub
    needs: [windows, ubuntu]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Télécharger les installateurs validés
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Créer les empreintes SHA256
        shell: bash
        run: |
          cd release
          sha256sum *.exe *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Publier la Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=()
          if [[ "$tag" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --generate-notes \
              --title "Abisses $tag" \
              "${prerelease[@]}"
          fi
