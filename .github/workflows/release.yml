name: Construire et publier Abisses

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Installateur Windows
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Vérifier la version du tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($version -ne $tagVersion) {
            throw "VERSION ($version) ne correspond pas au tag ($tagVersion)."
          }

      - name: Installer les dépendances de construction
        run: python -m pip install -r requirements-build-lock.txt

      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Construire l'installateur
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Conserver l'installateur Windows
        uses: actions/upload-artifact@v4
        with:
          name: abisses-windows
          path: release/*.exe
          if-no-files-found: error

  ubuntu:
    name: Paquet Ubuntu
    # Construire sur 22.04 vise Ubuntu 22.04 et les versions plus récentes.
    runs-on: ubuntu-22.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Vérifier la version du tag
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag_version" ]]; then
            echo "VERSION ($version) ne correspond pas au tag ($tag_version)." >&2
            exit 1
          fi

      - name: Installer les bibliothèques système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv python3-pip python3-tk dpkg-dev file \
            libtcl8.6 libtk8.6 libgl1 libglib2.0-0

      - name: Installer les dépendances de construction
        shell: bash
        run: |
          python3 -m venv .build-venv
          .build-venv/bin/python -m pip install --upgrade pip
          .build-venv/bin/python -m pip install -r requirements-build-lock.txt

      - name: Construire l'application et le paquet
        shell: bash
        run: |
          .build-venv/bin/python packaging/build_icons.py
          .build-venv/bin/python -m PyInstaller --noconfirm --clean packaging/abisses.spec
          bash packaging/linux/build_deb.sh

      - name: Vérifier le paquet
        shell: bash
        run: |
          bash packaging/linux/check_bundle.sh dist/Abisses
          dist/Abisses/Abisses --self-test
          dpkg-deb --info release/*.deb
          dpkg-deb --contents release/*.deb | head -80

      - name: Conserver le paquet Ubuntu
        uses: actions/upload-artifact@v4
        with:
          name: abisses-ubuntu
          path: release/*.deb
          if-no-files-found: error

  release:
    name: Release GitHub
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger les installateurs validés
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Créer les empreintes SHA256
        shell: bash
        run: |
          cd release
          sha256sum *.exe *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Publier la Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=()
          if [[ "$tag" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --generate-notes \
              --title "Abisses $tag" \
              "${prerelease[@]}"
          fi
