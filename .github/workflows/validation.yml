name: Validation Abisses

on:
  push:
  pull_request:

jobs:
  validation:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Vérifier la syntaxe
        run: >-
          python -m py_compile
          gestion_bisses.py
          lancer_gestion_bisses.py
          publier_mise_a_jour.py
          abisses_paths.py
          abisses_update.py
          abisses_update_ui.py
          packaging/build_icons.py

      - name: Tester les chemins locaux
        run: python -m unittest discover -s tests -p "test_abisses_paths.py" -v

      - name: Tester les mises à jour
        run: python -m unittest discover -s tests -p "test_abisses_update.py" -v

      - name: Tester la disposition de l'Atelier Photos
        run: python -m unittest discover -s tests -p "test_photo_workspace_layout.py" -v

      - name: Vérifier les espaces et marqueurs Git
        run: git diff --check

      - name: Vérifier les scripts Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n packaging/linux/build_deb.sh
          bash -n packaging/linux/check_bundle.sh
          sh -n packaging/linux/abisses
          sh -n packaging/linux/postinst
          sh -n packaging/linux/postrm
